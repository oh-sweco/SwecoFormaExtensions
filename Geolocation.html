<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forma Project Coordinates</title>

  <style>
    :root {
      font-family: Arial, Helvetica, sans-serif;
      color: #202124;
      background: #f5f6f7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
    }

    .panel {
      max-width: 420px;
      margin: 0 auto;
      padding: 20px;
      background: #ffffff;
      border: 1px solid #d9dde2;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 21px;
      font-weight: 600;
    }

    .description {
      margin: 0 0 18px;
      color: #5f6368;
      font-size: 13px;
      line-height: 1.4;
    }

    .section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e5e7eb;
    }

    .section h2 {
      margin: 0 0 10px;
      font-size: 15px;
      font-weight: 600;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 7px 0;
      font-size: 14px;
    }

    .label {
      color: #5f6368;
    }

    .value {
      font-family: Consolas, Monaco, monospace;
      text-align: right;
      overflow-wrap: anywhere;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 10px 14px;
      border: 0;
      border-radius: 6px;
      background: #1769aa;
      color: #ffffff;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover {
      background: #12578d;
    }

    button:disabled {
      background: #9aa0a6;
      cursor: wait;
    }

    #status {
      min-height: 18px;
      margin-top: 12px;
      color: #5f6368;
      font-size: 12px;
      line-height: 1.4;
    }

    #status.error {
      color: #b3261e;
    }
  </style>
</head>

<body>
  <main class="panel">
    <h1>Project Coordinates</h1>

    <p class="description">
      Project latitude and longitude converted to WGS84 / UTM zone 32.
    </p>

    <section>
      <div class="row">
        <span class="label">Latitude</span>
        <span class="value" id="latitude">—</span>
      </div>

      <div class="row">
        <span class="label">Longitude</span>
        <span class="value" id="longitude">—</span>
      </div>
    </section>

    <section class="section">
      <h2>UTM 32</h2>

      <div class="row">
        <span class="label">Zone</span>
        <span class="value" id="utmZone">32</span>
      </div>

      <div class="row">
        <span class="label">Hemisphere</span>
        <span class="value" id="utmHemisphere">—</span>
      </div>

      <div class="row">
        <span class="label">Easting</span>
        <span class="value" id="easting">—</span>
      </div>

      <div class="row">
        <span class="label">Northing</span>
        <span class="value" id="northing">—</span>
      </div>

      <div class="row">
        <span class="label">CRS</span>
        <span class="value" id="crs">—</span>
      </div>
    </section>

    <button id="refreshButton" type="button">
      Refresh coordinates
    </button>

    <div id="status" role="status"></div>
  </main>

  <!--
    Important:
    This must be a module script.
    It is placed after the HTML so all elements already exist.
  -->
  <script type="module">
    import { Forma } from "https://esm.sh/forma-embedded-view-sdk/auto";

    const elements = {
      latitude: document.getElementById("latitude"),
      longitude: document.getElementById("longitude"),
      utmZone: document.getElementById("utmZone"),
      utmHemisphere: document.getElementById("utmHemisphere"),
      easting: document.getElementById("easting"),
      northing: document.getElementById("northing"),
      crs: document.getElementById("crs"),
      refreshButton: document.getElementById("refreshButton"),
      status: document.getElementById("status")
    };

    function setStatus(message, isError = false) {
      elements.status.textContent = message;
      elements.status.classList.toggle("error", isError);
    }

    function formatNumber(value, decimals = 3) {
      return Number(value).toLocaleString(undefined, {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals
      });
    }

    /*
     * Converts WGS84 latitude/longitude to UTM zone 32.
     *
     * Northern hemisphere: EPSG:32632
     * Southern hemisphere: EPSG:32732
     */
    function latLonToUtm32(latitude, longitude) {
      const semiMajorAxis = 6378137.0;
      const eccentricitySquared = 0.00669437999014;
      const scaleFactor = 0.9996;
      const centralMeridianDegrees = 9.0;

      const latitudeRadians = latitude * Math.PI / 180;
      const longitudeRadians = longitude * Math.PI / 180;
      const centralMeridianRadians =
        centralMeridianDegrees * Math.PI / 180;

      const secondEccentricitySquared =
        eccentricitySquared /
        (1 - eccentricitySquared);

      const sinLatitude = Math.sin(latitudeRadians);
      const cosLatitude = Math.cos(latitudeRadians);
      const tanLatitude = Math.tan(latitudeRadians);

      const radiusOfCurvature =
        semiMajorAxis /
        Math.sqrt(
          1 -
          eccentricitySquared *
          sinLatitude *
          sinLatitude
        );

      const tangentSquared = tanLatitude * tanLatitude;

      const latitudeComponent =
        secondEccentricitySquared *
        cosLatitude *
        cosLatitude;

      const longitudeComponent =
        cosLatitude *
        (longitudeRadians - centralMeridianRadians);

      const meridionalArc =
        semiMajorAxis *
        (
          (
            1 -
            eccentricitySquared / 4 -
            3 * eccentricitySquared ** 2 / 64 -
            5 * eccentricitySquared ** 3 / 256
          ) * latitudeRadians
          -
          (
            3 * eccentricitySquared / 8 +
            3 * eccentricitySquared ** 2 / 32 +
            45 * eccentricitySquared ** 3 / 1024
          ) * Math.sin(2 * latitudeRadians)
          +
          (
            15 * eccentricitySquared ** 2 / 256 +
            45 * eccentricitySquared ** 3 / 1024
          ) * Math.sin(4 * latitudeRadians)
          -
          (
            35 * eccentricitySquared ** 3 / 3072
          ) * Math.sin(6 * latitudeRadians)
        );

      let easting =
        scaleFactor *
        radiusOfCurvature *
        (
          longitudeComponent
          +
          (
            1 -
            tangentSquared +
            latitudeComponent
          ) *
          longitudeComponent ** 3 / 6
          +
          (
            5 -
            18 * tangentSquared +
            tangentSquared ** 2 +
            72 * latitudeComponent -
            58 * secondEccentricitySquared
          ) *
          longitudeComponent ** 5 / 120
        )
        +
        500000.0;

      let northing =
        scaleFactor *
        (
          meridionalArc
          +
          radiusOfCurvature *
          tanLatitude *
          (
            longitudeComponent ** 2 / 2
            +
            (
              5 -
              tangentSquared +
              9 * latitudeComponent +
              4 * latitudeComponent ** 2
            ) *
            longitudeComponent ** 4 / 24
            +
            (
              61 -
              58 * tangentSquared +
              tangentSquared ** 2 +
              600 * latitudeComponent -
              330 * secondEccentricitySquared
            ) *
            longitudeComponent ** 6 / 720
          )
        );

      let hemisphere;
      let epsg;

      if (latitude < 0) {
        northing += 10000000.0;
        hemisphere = "South";
        epsg = "EPSG:32732";
      } else {
        hemisphere = "North";
        epsg = "EPSG:32632";
      }

      return {
        zone: 32,
        hemisphere,
        epsg,
        easting,
        northing
      };
    }

    function displayCoordinates(latitude, longitude) {
      const utm = latLonToUtm32(latitude, longitude);

      elements.latitude.textContent =
        `${latitude.toFixed(8)}°`;

      elements.longitude.textContent =
        `${longitude.toFixed(8)}°`;

      elements.utmZone.textContent =
        String(utm.zone);

      elements.utmHemisphere.textContent =
        utm.hemisphere;

      elements.easting.textContent =
        `${formatNumber(utm.easting)} m`;

      elements.northing.textContent =
        `${formatNumber(utm.northing)} m`;

      elements.crs.textContent =
        utm.epsg;
    }

    async function loadProjectCoordinates() {
      elements.refreshButton.disabled = true;
      setStatus("Reading project location…");

      try {
        console.log("Forma SDK:", Forma);
        console.log("Forma project API:", Forma.project);

        if (!Forma || !Forma.project) {
          throw new Error(
            "The Forma project API is not available."
          );
        }

        if (
          typeof Forma.project.getGeoLocation !== "function"
        ) {
          throw new Error(
            "Forma.project.getGeoLocation() is not available."
          );
        }

        const geoLocation =
          await Forma.project.getGeoLocation();

        console.log(
          "Geolocation returned by Forma:",
          geoLocation
        );

        if (!geoLocation) {
          throw new Error(
            "No geolocation is configured for this project."
          );
        }

        if (
          !Array.isArray(geoLocation) ||
          geoLocation.length < 2
        ) {
          throw new Error(
            "Unexpected geolocation format: " +
            JSON.stringify(geoLocation)
          );
        }

        const latitude = Number(geoLocation[0]);
        const longitude = Number(geoLocation[1]);

        if (
          !Number.isFinite(latitude) ||
          !Number.isFinite(longitude)
        ) {
          throw new Error(
            "Invalid coordinates returned by Forma: " +
            JSON.stringify(geoLocation)
          );
        }

        if (latitude < -90 || latitude > 90) {
          throw new Error(
            "Latitude is outside the valid range."
          );
        }

        if (longitude < -180 || longitude > 180) {
          throw new Error(
            "Longitude is outside the valid range."
          );
        }

        displayCoordinates(latitude, longitude);
        setStatus("Coordinates updated.");
      } catch (error) {
        console.error(
          "Failed to read project coordinates:",
          error
        );

        setStatus(
          error?.message ||
          "Unable to read project coordinates.",
          true
        );
      } finally {
        elements.refreshButton.disabled = false;
      }
    }

    elements.refreshButton.addEventListener(
      "click",
      loadProjectCoordinates
    );

    // Run after the module and HTML have loaded.
    loadProjectCoordinates();
  </script>
</body>
</html>
